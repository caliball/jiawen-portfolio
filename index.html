<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Jia Wen Portfolio</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #0d0d0d;
      color: #ffffff;
      text-align: center;
    }

    .container {
      max-width: 620px;
      padding: 40px 24px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 16px;
      letter-spacing: -1px;
      font-weight: 600;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
      color: #cfcfcf;
      margin-bottom: 28px;
    }

    .button {
      display: inline-block;
      padding: 14px 26px;
      border: 1px solid #ffffff;
      border-radius: 999px;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      transition: 0.2s ease;
    }

    .button:hover {
      background: #ffffff;
      color: #0d0d0d;
    }

    .note {
      margin-top: 22px;
      margin-bottom: 0;
      font-size: 14px;
      color: #8f8f8f;
    }

    .email {
      display: block;
      margin-top: 24px;
      color: #a8a8a8;
      font-size: 14px;
    }

    .email a {
      color: #ffffff;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Jia Wen</h1>

    <p>
      My full portfolio website is currently in development.
      In the meantime, you may view my portfolio PDF below.
    </p>

    <a class="button" href="https://drive.google.com/file/d/1HG1R-FcG9f6jQ9JGAJM2u0eDnKiRMNyn/view?usp=share_link" target="_blank">
      View Portfolio PDF
    </a>

    <p class="note">
      Full website updates and selected project features will be added soon.
    </p>

    <span class="email">
      Contact:
      <a href="mailto:cjwjiawen19@gmail.com">cjwjiawen19@gmail.com</a>
    </span>
  </main>
</body>
</html>
